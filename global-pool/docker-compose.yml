# GLOBAL POOL — local stack (DEMO / testnet only).
#   docker compose up -d postgres redis        # services only (alternative to scripts/dev-services.sh)
#   docker compose up --build                  # full stack: postgres, redis, api (:4000), web (:3000)
# Do not run alongside scripts/dev-services.sh on the same ports (override POSTGRES_PORT / REDIS_PORT).
name: global-pool

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: globalpool
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d globalpool']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      API_PORT: '4000'
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/globalpool?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@postgres:5432/globalpool_test?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000
      REAL_MONEY_ENABLED: 'false'
      DEMO_MODE: 'true'
      PRIVY_MOCK: ${PRIVY_MOCK:-true}
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_WS_URL: ws://localhost:4000
        NEXT_PUBLIC_DEMO_MODE: 'true'
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
        NEXT_PUBLIC_PRIVY_MOCK: ${NEXT_PUBLIC_PRIVY_MOCK:-true}
        NEXT_PUBLIC_CHAIN_ID: '421614'
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: '3000'
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
