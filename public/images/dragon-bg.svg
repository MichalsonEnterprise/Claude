<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a0a18"/>
      <stop offset="50%" stop-color="#0d0510"/>
      <stop offset="100%" stop-color="#060308"/>
    </radialGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="1"/>
      <stop offset="60%" stop-color="#fde68a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d4a017" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a017" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4a017" stop-opacity="0"/>
    </radialGradient>
    <filter id="fog" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="tinyBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <linearGradient id="groundFog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0514" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0514" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.4"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect width="1920" height="1080"/>
    </clipPath>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Stars -->
  <g opacity="0.8">
    <circle cx="120" cy="60" r="1.2" fill="#fff" opacity="0.9"/>
    <circle cx="280" cy="40" r="0.8" fill="#fff" opacity="0.7"/>
    <circle cx="450" cy="90" r="1.5" fill="#fff" opacity="0.6"/>
    <circle cx="600" cy="30" r="0.9" fill="#fff" opacity="0.8"/>
    <circle cx="750" cy="70" r="1.1" fill="#fff" opacity="0.5"/>
    <circle cx="900" cy="20" r="0.7" fill="#fff" opacity="0.9"/>
    <circle cx="1050" cy="55" r="1.3" fill="#fff" opacity="0.7"/>
    <circle cx="1200" cy="35" r="0.8" fill="#fff" opacity="0.6"/>
    <circle cx="1380" cy="80" r="1.2" fill="#fff" opacity="0.8"/>
    <circle cx="1500" cy="25" r="0.9" fill="#fff" opacity="0.7"/>
    <circle cx="1650" cy="60" r="1.4" fill="#fff" opacity="0.6"/>
    <circle cx="1800" cy="45" r="0.8" fill="#fff" opacity="0.9"/>
    <circle cx="200" cy="150" r="0.7" fill="#fde68a" opacity="0.6"/>
    <circle cx="380" cy="130" r="1.0" fill="#fff" opacity="0.5"/>
    <circle cx="820" cy="110" r="0.8" fill="#fde68a" opacity="0.7"/>
    <circle cx="1100" cy="140" r="1.1" fill="#fff" opacity="0.4"/>
    <circle cx="1450" cy="120" r="0.9" fill="#fff" opacity="0.6"/>
    <circle cx="1720" cy="100" r="0.7" fill="#fde68a" opacity="0.5"/>
    <circle cx="60" cy="200" r="0.6" fill="#fff" opacity="0.4"/>
    <circle cx="340" cy="180" r="0.9" fill="#fff" opacity="0.5"/>
    <circle cx="690" cy="170" r="0.7" fill="#fff" opacity="0.6"/>
    <circle cx="980" cy="190" r="1.0" fill="#fde68a" opacity="0.4"/>
    <circle cx="1260" cy="165" r="0.8" fill="#fff" opacity="0.5"/>
    <circle cx="1580" cy="185" r="0.6" fill="#fff" opacity="0.7"/>
    <circle cx="1870" cy="155" r="1.0" fill="#fff" opacity="0.4"/>
  </g>

  <!-- Moon glow aura -->
  <ellipse cx="1600" cy="180" rx="200" ry="200" fill="url(#moonGlow)" filter="url(#fog)"/>
  <!-- Moon -->
  <circle cx="1600" cy="180" r="70" fill="url(#moon)" filter="url(#tinyBlur)"/>
  <!-- Moon crater details -->
  <circle cx="1580" cy="165" r="8" fill="#e8d5a0" opacity="0.15"/>
  <circle cx="1620" cy="195" r="5" fill="#e8d5a0" opacity="0.12"/>
  <circle cx="1595" cy="200" r="6" fill="#e8d5a0" opacity="0.10"/>

  <!-- Distant mountains - far back -->
  <path d="M0,680 L80,560 L160,600 L250,520 L360,570 L450,490 L560,540 L650,460 L750,510 L850,440 L950,490 L1050,420 L1150,480 L1250,400 L1350,460 L1450,390 L1550,450 L1650,380 L1750,440 L1850,370 L1920,420 L1920,1080 L0,1080 Z" fill="#1a0820" opacity="0.9"/>
  <!-- Mountains mid layer -->
  <path d="M0,780 L100,650 L200,700 L320,610 L430,670 L540,590 L660,650 L760,570 L880,630 L980,560 L1080,620 L1180,540 L1300,600 L1400,530 L1510,590 L1620,520 L1730,580 L1840,510 L1920,560 L1920,1080 L0,1080 Z" fill="#140618" opacity="0.95"/>

  <!-- Red/gold glow at base of mountains (fire/horizon) -->
  <ellipse cx="960" cy="780" rx="700" ry="120" fill="#7f1d1d" opacity="0.25" filter="url(#fog)"/>
  <ellipse cx="960" cy="800" rx="400" ry="60" fill="#d4a017" opacity="0.12" filter="url(#fog)"/>

  <!-- Pagoda silhouette - main, center -->
  <g transform="translate(760, 400)">
    <!-- Base platform -->
    <rect x="-80" y="330" width="160" height="12" fill="#0d0610"/>
    <rect x="-60" y="320" width="120" height="10" fill="#0d0610"/>
    <!-- Main tower body -->
    <rect x="-22" y="100" width="44" height="230" fill="#0d0610"/>
    <!-- Roof tier 1 (bottom, widest) -->
    <path d="M-70,320 Q0,290 70,320 L55,310 Q0,282 -55,310 Z" fill="#110812"/>
    <path d="M-78,325 L78,325 L60,308 Q0,285 -60,308 Z" fill="#0a0608"/>
    <!-- Roof tier 2 -->
    <path d="M-55,240 Q0,210 55,240 L45,230 Q0,202 -45,230 Z" fill="#110812"/>
    <path d="M-60,244 L60,244 L45,228 Q0,200 -45,228 Z" fill="#0a0608"/>
    <!-- Roof tier 3 -->
    <path d="M-40,170 Q0,142 40,170 L32,160 Q0,133 -32,160 Z" fill="#110812"/>
    <path d="M-44,174 L44,174 L32,158 Q0,130 -32,158 Z" fill="#0a0608"/>
    <!-- Roof tier 4 (top, smallest) -->
    <path d="M-26,110 Q0,86 26,110 L20,100 Q0,78 -20,100 Z" fill="#110812"/>
    <path d="M-28,113 L28,113 L20,98 Q0,75 -20,98 Z" fill="#0a0608"/>
    <!-- Spire -->
    <rect x="-3" y="40" width="6" height="50" fill="#1a0d1e"/>
    <polygon points="0,20 -5,55 5,55" fill="#d4a017" opacity="0.6"/>
    <!-- Windows (lit gold) -->
    <rect x="-8" y="200" width="16" height="20" rx="2" fill="#d4a017" opacity="0.3"/>
    <rect x="-8" y="260" width="16" height="20" rx="2" fill="#d4a017" opacity="0.25"/>
    <rect x="-8" y="140" width="14" height="16" rx="2" fill="#d4a017" opacity="0.2"/>
  </g>

  <!-- Pagoda silhouette - left, smaller -->
  <g transform="translate(320, 520)" opacity="0.7">
    <rect x="-14" y="60" width="28" height="160" fill="#0d0610"/>
    <path d="M-45,215 Q0,190 45,215 L36,205 Q0,182 -36,205 Z" fill="#0a0608"/>
    <path d="M-32,160 Q0,138 32,160 L26,150 Q0,130 -26,150 Z" fill="#0a0608"/>
    <path d="M-22,115 Q0,96 22,115 L18,106 Q0,88 -18,106 Z" fill="#0a0608"/>
    <rect x="-2" y="30" width="4" height="35" fill="#1a0d1e"/>
    <polygon points="0,15 -4,38 4,38" fill="#d4a017" opacity="0.4"/>
  </g>

  <!-- Pagoda silhouette - right, smaller -->
  <g transform="translate(1480, 500)" opacity="0.65">
    <rect x="-12" y="50" width="24" height="150" fill="#0d0610"/>
    <path d="M-40,200 Q0,178 40,200 L32,191 Q0,170 -32,191 Z" fill="#0a0608"/>
    <path d="M-28,150 Q0,130 28,150 L22,141 Q0,122 -22,141 Z" fill="#0a0608"/>
    <path d="M-19,106 Q0,88 19,106 L15,97 Q0,80 -15,97 Z" fill="#0a0608"/>
    <rect x="-2" y="24" width="4" height="30" fill="#1a0d1e"/>
    <polygon points="0,12 -3,32 3,32" fill="#d4a017" opacity="0.35"/>
  </g>

  <!-- Trees / pine silhouettes left -->
  <g fill="#080410" opacity="0.9">
    <polygon points="80,900 110,760 140,900"/>
    <polygon points="100,900 125,790 150,900"/>
    <polygon points="60,900 85,800 115,900"/>
    <polygon points="140,900 165,820 195,900"/>
    <polygon points="25,900 55,840 80,900"/>
  </g>
  <!-- Trees right -->
  <g fill="#080410" opacity="0.9">
    <polygon points="1780,900 1810,760 1840,900"/>
    <polygon points="1800,900 1825,790 1855,900"/>
    <polygon points="1750,900 1775,800 1805,900"/>
    <polygon points="1840,900 1865,820 1895,900"/>
    <polygon points="1860,900 1885,850 1915,900"/>
  </g>

  <!-- Foreground fog layers -->
  <rect x="0" y="820" width="1920" height="260" fill="#1a0820" opacity="0.7" filter="url(#softBlur)"/>
  <ellipse cx="200" cy="950" rx="400" ry="80" fill="#1a0820" opacity="0.6" filter="url(#fog)"/>
  <ellipse cx="800" cy="970" rx="500" ry="70" fill="#1a0820" opacity="0.5" filter="url(#fog)"/>
  <ellipse cx="1500" cy="940" rx="450" ry="90" fill="#1a0820" opacity="0.6" filter="url(#fog)"/>
  <ellipse cx="960" cy="1000" rx="700" ry="100" fill="#0d0610" opacity="0.8" filter="url(#fog)"/>

  <!-- Ground gradient overlay -->
  <rect x="0" y="700" width="1920" height="380" fill="url(#groundFog)"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#redGlow)"/>
</svg>
