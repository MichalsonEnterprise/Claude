<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgGate" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#12050f"/>
      <stop offset="100%" stop-color="#060208"/>
    </radialGradient>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a017" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#7f1d1d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d4a017" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="innerLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#d4a017" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <filter id="fBlur"><feGaussianBlur stdDeviation="25"/></filter>
    <filter id="mBlur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="sBlur"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="fogH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12050f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#12050f" stop-opacity="1"/>
    </linearGradient>
    <mask id="gateMask">
      <rect width="1920" height="1080" fill="white"/>
      <!-- Gate opening -->
      <ellipse cx="960" cy="620" rx="180" ry="260" fill="black"/>
    </mask>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGate)"/>

  <!-- Background glow through gate -->
  <ellipse cx="960" cy="540" rx="400" ry="350" fill="url(#portalGlow)" filter="url(#fBlur)"/>

  <!-- Stars -->
  <g opacity="0.6" fill="#ffffff">
    <circle cx="100" cy="80" r="1"/><circle cx="250" cy="50" r="1.5"/><circle cx="400" cy="100" r="1"/>
    <circle cx="550" cy="40" r="1"/><circle cx="700" cy="90" r="1.5"/><circle cx="850" cy="55" r="1"/>
    <circle cx="1100" cy="65" r="1"/><circle cx="1300" cy="45" r="1.5"/><circle cx="1500" cy="80" r="1"/>
    <circle cx="1700" cy="35" r="1"/><circle cx="1850" cy="95" r="1.5"/>
    <circle cx="180" cy="200" r="0.8"/><circle cx="450" cy="180" r="1"/><circle cx="750" cy="160" r="0.8"/>
    <circle cx="1200" cy="175" r="1"/><circle cx="1600" cy="155" r="0.8"/>
  </g>

  <!-- Distant mist mountains -->
  <path d="M0,600 L150,450 L300,510 L480,410 L620,470 L800,370 L960,430 L1120,360 L1300,420 L1450,350 L1600,410 L1780,350 L1920,400 L1920,1080 L0,1080 Z" fill="#1a0820" opacity="0.5"/>

  <!-- MAIN TORII / TEMPLE GATE STRUCTURE -->
  <!-- Left pillar -->
  <rect x="660" y="300" width="70" height="580" rx="8" fill="#0d0510"/>
  <!-- Right pillar -->
  <rect x="1190" y="300" width="70" height="580" rx="8" fill="#0d0510"/>

  <!-- Top horizontal beam (kasagi) -->
  <path d="M600,300 Q960,260 1320,300 L1310,330 Q960,290 610,330 Z" fill="#0d0510"/>
  <!-- Slight upward curve at ends -->
  <path d="M600,300 L610,285 Q650,275 700,280 L700,300 Z" fill="#0d0510"/>
  <path d="M1320,300 L1310,285 Q1270,275 1220,280 L1220,300 Z" fill="#0d0510"/>

  <!-- Second beam (nuki) lower -->
  <rect x="650" y="390" width="620" height="32" rx="6" fill="#0d0510"/>

  <!-- Decorative top beam end ornaments -->
  <ellipse cx="610" cy="290" rx="18" ry="10" fill="#1a0820" opacity="0.8"/>
  <ellipse cx="1310" cy="290" rx="18" ry="10" fill="#1a0820" opacity="0.8"/>

  <!-- Inner gate arch (ornamental) -->
  <path d="M720,970 L720,480 Q960,380 1200,480 L1200,970" stroke="#1a0d20" stroke-width="20" fill="none" opacity="0.7"/>

  <!-- Portal / archway inner glow -->
  <ellipse cx="960" cy="630" rx="160" ry="240" fill="url(#innerLight)" filter="url(#mBlur)"/>

  <!-- Hanging lanterns -->
  <!-- Left lantern -->
  <g transform="translate(730, 410)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#2d1a0a" stroke-width="3"/>
    <rect x="-18" y="30" width="36" height="55" rx="8" fill="#7f2d00" opacity="0.85"/>
    <rect x="-13" y="33" width="26" height="49" rx="6" fill="#d4a017" opacity="0.3"/>
    <ellipse cx="0" cy="30" rx="10" ry="6" fill="#5c2000"/>
    <ellipse cx="0" cy="85" rx="10" ry="6" fill="#5c2000"/>
    <line x1="-4" y1="85" x2="-4" y2="105" stroke="#2d1a0a" stroke-width="2"/>
    <line x1="4" y1="85" x2="4" y2="105" stroke="#2d1a0a" stroke-width="2"/>
    <!-- Glow -->
    <ellipse cx="0" cy="57" rx="25" ry="35" fill="#d4a017" opacity="0.15" filter="url(#sBlur)"/>
  </g>
  <!-- Right lantern -->
  <g transform="translate(1190, 410)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#2d1a0a" stroke-width="3"/>
    <rect x="-18" y="30" width="36" height="55" rx="8" fill="#7f2d00" opacity="0.85"/>
    <rect x="-13" y="33" width="26" height="49" rx="6" fill="#d4a017" opacity="0.3"/>
    <ellipse cx="0" cy="30" rx="10" ry="6" fill="#5c2000"/>
    <ellipse cx="0" cy="85" rx="10" ry="6" fill="#5c2000"/>
    <line x1="-4" y1="85" x2="-4" y2="105" stroke="#2d1a0a" stroke-width="2"/>
    <line x1="4" y1="85" x2="4" y2="105" stroke="#2d1a0a" stroke-width="2"/>
    <ellipse cx="0" cy="57" rx="25" ry="35" fill="#d4a017" opacity="0.15" filter="url(#sBlur)"/>
  </g>

  <!-- Smaller flanking lanterns -->
  <g transform="translate(810, 430)" opacity="0.7">
    <line x1="0" y1="0" x2="0" y2="22" stroke="#2d1a0a" stroke-width="2"/>
    <rect x="-12" y="22" width="24" height="36" rx="5" fill="#7f2d00"/>
    <rect x="-9" y="25" width="18" height="30" rx="4" fill="#d4a017" opacity="0.2"/>
    <ellipse cx="0" cy="40" rx="18" ry="24" fill="#d4a017" opacity="0.1" filter="url(#sBlur)"/>
  </g>
  <g transform="translate(1110, 430)" opacity="0.7">
    <line x1="0" y1="0" x2="0" y2="22" stroke="#2d1a0a" stroke-width="2"/>
    <rect x="-12" y="22" width="24" height="36" rx="5" fill="#7f2d00"/>
    <rect x="-9" y="25" width="18" height="30" rx="4" fill="#d4a017" opacity="0.2"/>
    <ellipse cx="0" cy="40" rx="18" ry="24" fill="#d4a017" opacity="0.1" filter="url(#sBlur)"/>
  </g>

  <!-- Stone steps leading to gate -->
  <rect x="840" y="950" width="240" height="18" rx="3" fill="#1a0d20"/>
  <rect x="870" y="930" width="180" height="18" rx="3" fill="#1a0d20"/>
  <rect x="900" y="910" width="120" height="18" rx="3" fill="#1a0d20"/>

  <!-- Decorative rope (shimenawa) between pillars -->
  <path d="M730,455 Q960,445 1190,455" stroke="#3d2a00" stroke-width="8" fill="none" opacity="0.6"/>
  <path d="M730,455 Q960,445 1190,455" stroke="#d4a017" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Ground fog -->
  <ellipse cx="500" cy="980" rx="600" ry="120" fill="#12050f" opacity="0.8" filter="url(#fBlur)"/>
  <ellipse cx="1400" cy="1000" rx="550" ry="100" fill="#12050f" opacity="0.8" filter="url(#fBlur)"/>
  <ellipse cx="960" cy="1020" rx="800" ry="130" fill="#0a0210" opacity="0.9" filter="url(#mBlur)"/>

  <!-- Pine tree silhouettes flanking gate -->
  <g fill="#080310" opacity="0.9">
    <polygon points="480,970 530,730 580,970"/>
    <polygon points="510,970 555,780 600,970"/>
    <polygon points="450,970 490,810 535,970"/>
    <polygon points="550,970 590,800 630,970"/>
  </g>
  <g fill="#080310" opacity="0.9">
    <polygon points="1340,970 1390,730 1440,970"/>
    <polygon points="1370,970 1415,780 1460,970"/>
    <polygon points="1310,970 1350,810 1395,970"/>
    <polygon points="1400,970 1440,800 1480,970"/>
  </g>

  <!-- Overlay fog/dark gradient at bottom -->
  <rect x="0" y="700" width="1920" height="380" fill="url(#fogH)"/>
</svg>
